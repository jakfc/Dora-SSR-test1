name: 素材校验

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assets:
    name: Assets.ts 与素材同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验代码引用的资源 id 都已登记
        run: python tools/lint_assets.py

      - name: 对照表文档与 Assets.ts 是否同步
        run: |
          python tools/gen_asset_table.py
          if ! git diff --quiet docs/素材替换对照表.md; then
            echo "::error::docs/素材替换对照表.md 与 src/config/Assets.ts 不一致，请本地执行 python tools/gen_asset_table.py 后提交"
            git --no-pager diff --stat docs/素材替换对照表.md
            exit 1
          fi

      - name: 检查是否误提交了构建产物
        run: |
          bad=0
          for f in $(git ls-files '*.lua'); do
            # 同名 .ts 存在 → 这个 .lua 就是引擎的编译产物，不该入库
            if git ls-files --error-unmatch "${f%.lua}.ts" >/dev/null 2>&1; then
              echo "::error::$f 是 ${f%.lua}.ts 的编译产物，不应入库"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "OK：没有提交 TS 编译产物（tools/ 下手写的自检探针不在此列）"
